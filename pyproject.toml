[project]
name = "index-tts-audiobook"
version = "0.1.0"
description = "Reliable long-form audiobook orchestration for IndexTTS backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencc-python-reimplemented>=0.1.7",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
audiobook = "audiobook_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiobook_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
